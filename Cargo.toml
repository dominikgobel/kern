[package]
name = "kern"
version = "0.1.1"
edition = "2024"
description = "A terminal based text editor"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
supports-color = "3.0.2"
syntect = "5.3.0"
tar = "0.4.46"
unicode-width = "0.2.2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
flate2 = "1.1.10"
httpmock = "0.9.0"
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
